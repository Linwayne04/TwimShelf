[package]
name = "tl-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs", "io-util"] }
futures-util = "0.3"
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
libc = "0.2"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
spake2 = "0.4"
# Protected (locked) accounts: fetched by the separate module `tl-protected` through the types
# of `tl-protected-api`, compiled into this library (plain function calls, no extra process).
tl-protected-api = { path = "protected-api" }
tl-protected = { path = "protected" }

# One workspace, so `cargo test --workspace` here also runs the protected module's own tests.
[workspace]
members = [".", "protected", "protected-api"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[dev-dependencies]
proptest = "1"

# Crypto, hashing, SQLite and compression are 20-50x slower unoptimized; optimize
# dependencies even in debug builds (our own crate stays debuggable).
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
