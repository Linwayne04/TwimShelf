[package]
name = "tl-protected"
version = "1.0.0"
edition = "2021"
description = "Protected-post module for TwimShelf: fetches posts with the user's X session cookies."
publish = false

[dependencies]
tl-protected-api = { path = "../protected-api" }
# rustls only: no OpenSSL, and the three Apple targets cross-compile.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "blocking"] }
serde_json = "1"
url = "2"

[lib]
name = "tl_protected"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
