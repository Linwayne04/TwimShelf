# Template: run python3 scripts/configure.py; do not run XcodeGen on this file directly.
name: TwimShelf
options:
  bundleIdPrefix: ""
packages:
  mlx-swift-lm: { url: https://github.com/ml-explore/mlx-swift-lm, from: 3.32.3 }
  swift-transformers: { url: https://github.com/huggingface/swift-transformers, from: 1.3.0 }
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_OBJC_BRIDGING_HEADER: app/Shared/tl_core.h
    OTHER_LDFLAGS: -ltl_core
    LIBRARY_SEARCH_PATHS: $(BUILT_PRODUCTS_DIR)
    CODE_SIGN_IDENTITY: "-"
    PRODUCT_NAME: TwimShelf
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
    SWIFT_STRICT_CONCURRENCY: minimal
targetTemplates:
  App:
    dependencies:
      - { package: mlx-swift-lm, product: MLXVLM }
      - { package: mlx-swift-lm, product: MLXLMCommon }
      - { package: mlx-swift-lm, product: MLXEmbedders }
      - { package: swift-transformers, product: Tokenizers }
    preBuildScripts: [{ name: Build Rust core, script: "\"$SRCROOT/scripts/build_core.sh\"", basedOnDependencyAnalysis: false }]
targets:
  TwitterLibrary-iOS:
    templates: [App]
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [app/Shared, app/iOS, app/Resources]
    dependencies:
      - { target: TwitterLibrary-iOSShare, embed: true, codeSign: true }
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: ""
        CODE_SIGN_ENTITLEMENTS: app/iOS/TwitterLibrary.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: app/iOS/Info.plist
      properties: &plist
        CFBundleDisplayName: TwimShelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: { UIColorName: "" }
        UIApplicationSceneManifest: { UIApplicationSupportsMultipleScenes: false }
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: 用于在局域网中发现你的其他设备并直接同步资料库。
        NSBonjourServices: [_twlib._tcp]
        UIBackgroundModes: [audio]
        CADisableMinimumFrameDurationOnPhone: true   # 120 Hz grid zoom on ProMotion phones
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: local.twitterlibrary.tlpack
            UTTypeDescription: TwimShelf 导出包
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification: { public.filename-extension: [tlpack] }
        CFBundleDocumentTypes:
          - CFBundleTypeName: TwimShelf 导出包
            LSItemContentTypes: [local.twitterlibrary.tlpack]
            LSHandlerRank: Owner
            CFBundleTypeRole: Viewer
  TwitterLibrary-macOS:
    templates: [App]
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources: [app/Shared, app/macOS, app/Resources]
    dependencies:
      - { target: TwitterLibrary-macOSShare, embed: true, codeSign: true }
    settings:
      configs:
        # debug builds are a separate app: own settings, keychain items and window frames,
        # so test runs never read or change the installed app's
        Debug: { PRODUCT_BUNDLE_IDENTIFIER: "", TL_URL_SCHEME: twimshelf-debug }
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ""
        ARCHS: arm64
        CODE_SIGN_ENTITLEMENTS: app/macOS/TwitterLibrary.entitlements
        TL_URL_SCHEME: twimshelf
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    info:
      path: app/macOS/Info.plist
      properties:
        CFBundleDisplayName: TwimShelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.photography
        CFBundleURLTypes:
          - CFBundleURLName: local.twitterlibrary.share
            CFBundleURLSchemes: [$(TL_URL_SCHEME)]
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: 用于在局域网中发现你的其他设备并直接同步资料库。
        NSBonjourServices: [_twlib._tcp, _twlib-debug._tcp]   # the debug build advertises its own type
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: local.twitterlibrary.tlpack
            UTTypeDescription: TwimShelf 导出包
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification: { public.filename-extension: [tlpack] }
        CFBundleDocumentTypes:
          - CFBundleTypeName: TwimShelf 导出包
            LSItemContentTypes: [local.twitterlibrary.tlpack]
            LSHandlerRank: Owner
            CFBundleTypeRole: Viewer
  TwitterLibrary-iOSShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources: [app/ShareExtension/Common, app/ShareExtension/iOS]
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PRODUCT_BUNDLE_IDENTIFIER: ""
        PRODUCT_NAME: TwimShelfShare
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
        CODE_SIGN_ENTITLEMENTS: app/ShareExtension/iOS/Share.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    info:
      path: app/ShareExtension/iOS/Info.plist
      properties:
        CFBundleDisplayName: 导入 TwimShelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.folder").@count > 0).@count > 0'
  TwitterLibrary-macOSShare:
    type: app-extension
    platform: macOS
    deploymentTarget: "15.0"
    sources: [app/ShareExtension/Common, app/ShareExtension/macOS]
    settings:
      configs:
        Debug: { PRODUCT_BUNDLE_IDENTIFIER: "", TL_URL_SCHEME: twimshelf-debug }
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ""
        PRODUCT_NAME: TwimShelfShare
        ARCHS: arm64
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
        CODE_SIGN_ENTITLEMENTS: app/ShareExtension/macOS/Share.entitlements
        TL_URL_SCHEME: twimshelf
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: YES
    info:
      path: app/ShareExtension/macOS/Info.plist
      properties:
        CFBundleDisplayName: 导入 TwimShelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        TLAppURLScheme: $(TL_URL_SCHEME)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.movie" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.folder").@count > 0).@count > 0'
  TwitterLibrary-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources: [app/iOSUITests]
    dependencies: [{ target: TwitterLibrary-iOS }]
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_LDFLAGS: ""
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TwitterLibrary-iOS
        PRODUCT_NAME: TwitterLibraryUITests
        PRODUCT_BUNDLE_IDENTIFIER: ""
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

schemes:
  TwitterLibrary-iOS:
    build: { targets: { TwitterLibrary-iOS: all, TwitterLibrary-iOSUITests: [test] } }
    test: { targets: [TwitterLibrary-iOSUITests] }
  TwitterLibrary-macOS:
    build: { targets: { TwitterLibrary-macOS: all } }
